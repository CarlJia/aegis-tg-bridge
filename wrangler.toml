name = "aegis-tg-bridge"
compatibility_date = "2024-01-01"
main = "src/index.ts"

# KV namespaces — replace IDs with actual values from `wrangler kv:namespace create`
# STATE: all operational keys (whitelist, blacklist, user_settings, owner_chat_id,
#        pending_buttons, summary_queue, message_map, last_summary)
# RULES: reserved for KV-based rule overrides
# SUMMARY: reserved (currently unused; summary data lives in STATE)
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_STATE_KV_ID"
preview_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "RULES"
id = "REPLACE_WITH_RULES_KV_ID"
preview_id = "00000000-0000-0000-0000-000000000001"

[[kv_namespaces]]
binding = "SUMMARY"
id = "REPLACE_WITH_SUMMARY_KV_ID"
preview_id = "00000000-0000-0000-0000-000000000002"

# Environment variables injected via wrangler secret put BOT_TOKEN WEBHOOK_SECRET
# or defined in .dev.vars for local development (gitignored)

# Cron trigger — U8: every 5 minutes; the handler matches the owner's local
# summary hour and pushes the daily digest.
[triggers]
crons = ["*/5 * * * *"]
