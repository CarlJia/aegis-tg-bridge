name = "aegis-tg-bridge"
compatibility_date = "2024-01-01"
main = "src/index.ts"

# KV namespaces — real namespace IDs from `wrangler kv namespace create`.
# STATE: all operational keys (whitelist, blacklist, user_settings, owner_chat_id,
#        pending_buttons, summary_queue, message_map, last_summary)
# RULES: reserved for KV-based rule overrides
# SUMMARY: reserved (currently unused; summary data lives in STATE)
# Local `wrangler dev` uses in-memory miniflare KV, so no preview_id is needed.
# To point `wrangler dev --remote` at a separate preview namespace, create one
# with `--preview` and add its id as `preview_id` here.
[[kv_namespaces]]
binding = "STATE"
id = "736cb895ad8b458483cee87f829767c9"

[[kv_namespaces]]
binding = "RULES"
id = "9ff26c1e58d943c4871f02a89ef56d3d"

[[kv_namespaces]]
binding = "SUMMARY"
id = "b6fcbb0e02004281a20ccabbfcdf68ec"

# Environment variables injected via wrangler secret put BOT_TOKEN WEBHOOK_SECRET
# or defined in .dev.vars for local development (gitignored)

# Cron trigger — U8: every 5 minutes; the handler matches the owner's local
# summary hour and pushes the daily digest.
[triggers]
crons = ["*/5 * * * *"]
